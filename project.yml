name: Notely
options:
  bundleIdPrefix: com.notes
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.notes.app
    PRODUCT_NAME: Notely
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright (c) 2025 Dylan Deng"
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"

targets:
  Notely:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Notely
        excludes:
          - "Resources/**"
      - path: Notely/Resources/Assets.xcassets
    info:
      path: Notely/Info.plist
      properties:
        CFBundleDisplayName: Notely
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      base:
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
